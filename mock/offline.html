<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saibem — sem conexão</title>
<style>
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:linear-gradient(135deg,#07182E 0%,#0C2544 60%,#12325A 100%); color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; text-align:center}
  .box{max-width:340px; display:flex; flex-direction:column; align-items:center; gap:14px}
  .mk{width:56px; height:56px; border-radius:16px; background:rgba(77,208,255,.14);
    border:1px solid rgba(77,208,255,.4); display:grid; place-items:center}
  .mk svg{width:28px; height:28px; stroke:#4DD0FF; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
  h1{margin:0; font-size:21px; font-weight:800; letter-spacing:-.02em}
  p{margin:0; font-size:14px; line-height:1.55; color:rgba(255,255,255,.75)}
  button{margin-top:6px; height:44px; padding:0 22px; border:0; border-radius:9px; cursor:pointer;
    background:#4DD0FF; color:#07182E; font-size:15px; font-weight:700; font-family:inherit}
  button:hover{background:#7FDCFF}
  .fine{font-size:12px; color:rgba(255,255,255,.5)}
</style>
</head>
<body>
  <div class="box">
    <span class="mk"><svg viewBox="0 0 24 24"><path d="M1 1l22 22"/><path d="M16.7 16.7A11 11 0 0 1 12 18"/><path d="M5 12.5a7 7 0 0 1 4-2.3"/><path d="M2 8.8a12 12 0 0 1 4-2.4"/><path d="M22 8.8a12 12 0 0 0-8.5-3.3"/></svg></span>
    <h1>Você está sem conexão</h1>
    <p>As fotos que você já abriu continuam disponíveis. Para buscar novos eventos, precisamos de internet.</p>
    <button onclick="location.href='./'">Tentar de novo</button>
    <span class="fine">Saibem · você saiu bem</span>
  </div>
  <script>
    window.addEventListener('online', function(){ location.href = './'; });
  </script>
</body>
</html>
