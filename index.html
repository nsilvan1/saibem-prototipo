<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saibem</title>
<meta name="theme-color" content="#07182E">
<link rel="icon" href="mock/icon-192.png" type="image/png">
<script>
  /* Desregistra o service worker antigo, que tinha escopo na raiz.
     Sem isto, quem instalou o PWA antes da reorganização continuaria
     preso ao cache velho. O app real vive em mock/ e registra o seu. */
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){ if (r.scope.indexOf('/mock/') === -1) r.unregister(); });
    }).catch(function(){});
    if (window.caches){
      caches.keys().then(function(ks){
        ks.forEach(function(k){ if (k.indexOf('saibem-v') === 0) caches.delete(k); });
      }).catch(function(){});
    }
  }
  /* preserva a rota: /#/e/cerrado10k continua funcionando */
  var destino = 'mock/' + (location.hash || '');
  setTimeout(function(){ location.replace(destino); }, 60);
</script>
<style>
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; text-align:center;
    background:linear-gradient(135deg,#07182E 0%,#0C2544 60%,#12325A 100%); color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .box{display:flex; flex-direction:column; align-items:center; gap:14px; max-width:340px}
  .mk{width:52px; height:52px; border-radius:15px; background:#4DD0FF; color:#07182E; display:grid; place-items:center}
  .mk svg{width:28px; height:28px; stroke:currentColor; fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
  h1{margin:0; font-size:21px; font-weight:800; letter-spacing:-.02em}
  p{margin:0; font-size:14px; color:rgba(255,255,255,.75); line-height:1.55}
  a{color:#4DD0FF; font-weight:700}
</style>
</head>
<body>
  <div class="box">
    <span class="mk"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
    <h1>Saibem</h1>
    <p>Abrindo o protótipo…<br><a href="mock/">Entrar agora</a></p>
  </div>
</body>
</html>
